[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "re-memory"
version = "0.1.0"
description = "A brain-anatomical memory engine for AI agents"
requires-python = ">=3.11"
license = "MIT"
keywords = ["memory", "ai", "agents", "neuroscience", "knowledge-graph"]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "qdrant-client>=1.9",
    "falkordb>=1.0",
    "openai>=1.0",
    "anthropic>=0.25",
    "httpx>=0.27",
    "numpy>=1.26",
    "apscheduler>=3.10",
    "tomli-w>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
re-memory = "re_memory.cli:app"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "re_memory._core"
python-source = "src"
manifest-path = "rust/Cargo.toml"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
